[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendar-planning-agent"
version = "0.1.0"
description = "A beginner-friendly fake-calendar planning agent foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
calendar-agent-demo = "calendar_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
